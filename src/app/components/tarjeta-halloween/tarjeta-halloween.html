
<article class="tarjeta">
    <img [src]="objeto.imagen" [alt]="objeto.objeto">

    <div class="contenido">
        <h3>{{ objeto.objeto }}</h3>
        <p>{{ objeto.descripcion }}</p>
        <p class="propietario">Propietario: {{ objeto.propietario }}</p>

        <button
            type="button"
            class="btn-eliminar"
            (click)="solicitarEliminacion()">
            Eliminar
        </button>
    </div>
</article>
