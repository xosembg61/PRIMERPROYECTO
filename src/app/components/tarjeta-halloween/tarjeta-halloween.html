
<div class="tarjeta">

    <img [src]="objeto.imagen" [alt]="objeto.objeto">

    <div class="informacion">
        <h3>{{ objeto.objeto }}</h3>

        <p>{{ objeto.descripcion }}</p>

        <p class="propietario">
            Propietario: {{ objeto.propietario }}
        </p>
    </div>

</div>
