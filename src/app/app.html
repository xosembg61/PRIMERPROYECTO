<mat-toolbar>
    <button matIconButton class="example-icon" aria-label="Example icon-button with menu icon">
    <mat-icon>menu</mat-icon>
  </button>

  <span>Mi APP: </span>
  <span class="example-spacer"></span>

    <button matButton="elevated"  routerLink="/lista">Lista <mat-icon>favorite</mat-icon></button>

    <button matButton="elevated"  routerLink="/calculadora">Calculadora <mat-icon>calculate</mat-icon></button>

    <button matButton="elevated"  routerLink="/smaforo">Semáforo <mat-icon>traffic</mat-icon></button>

    <button matButton="elevated"  routerLink="/padre-hijo">Padre-Hijo <mat-icon>skull</mat-icon></button>

    <button matButton="elevated"  routerLink="/clicker">Clicker <mat-icon>ads_click</mat-icon></button>

    <button matIconButton
      type="button"
      (click)="modeService.cambiar()"

      <mat-icon>{{ modeService.modo() ? 'light_mode' : 'dark_mode' }}</mat-icon>
    </button>

</mat-toolbar>
